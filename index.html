<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="calculator.css">
</head>
<body>
    <div class="calculator">

    <input id="input-box" input type="text" placeholder 0 readonly>
    

<div class="keyword">
    <div>
        <button class="operator">
            AC
        </button>
        <button class="operator">
            DEL
        </button>
        <button class="operator">
            %
        </button>
        <button class="operator">
            /
        </button>
        
    </div>

  <div>
        <button>
            7
        </button>
        <button>
            8
        </button>
        <button>
            9
        </button>
        <button class="operator">
            *
        </button>
        
    </div>
      <div>
        <button>
            4
        </button>
        <button>
            5
        </button>
        <button>
           6
        </button>
        <button class="operator">
            -
        </button>
        
    </div>
      <div>
        <button>
            1
        </button>
        <button>
            2
        </button>
        <button>
           3
        </button>
        <button class="operator">
            +
        </button>
        
    </div>

 <div>
        <button>
            00
        </button>
        <button>
            0
        </button>
        <button class="operator">
           .
        </button>
        <button class="equalbtn">
            =
        </button>
        
    </div>
        

    
</div>
        <p style="text-align: center; font-size: 13px; color: #11ff00; font-weight: bold; margin-top:20px;">Created by Anubhab Dutta.</p>
        
</div>
<script src ="app.js"></script>

</body>
</html>
